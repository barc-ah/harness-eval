name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check harness_eval
      - name: Test
        run: pytest -q tests/
      - name: Dry run smoke test
        run: |
          bash scripts/make_fixture.sh
          harness-eval run --tasks tasks/samples --harness claude-code --dry-run
